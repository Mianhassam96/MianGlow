<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO — title/description updated dynamically by viewer.js -->
  <title>✨ You have a birthday surprise!</title>
  <meta name="description" content="Someone created a personalized animated birthday surprise for you on MianGlow. Tap to open!" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph (best-effort — real data is in URL hash, not crawlable) -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="🎂 You have a birthday surprise!" />
  <meta property="og:description" content="Someone made a beautiful animated birthday experience just for you on MianGlow." />
  <meta property="og:image"       content="https://mianhassam96.github.io/MianGlow/assets/images/og-image.png" />

  <!-- PWA -->
  <meta name="theme-color" content="#D4A017" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/viewer.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>

  <!-- Full-screen FX canvases (confetti + fireworks sit on top, z-index 0) -->
  <canvas id="canvas-confetti"  style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;" aria-hidden="true"></canvas>
  <canvas id="canvas-fireworks" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;" aria-hidden="true"></canvas>

  <!-- ============================================================
       SCENE 1 — Invitation
  ============================================================ -->
  <div class="scene" id="scene-invite" aria-label="Birthday invitation">
    <div class="invite-glow" aria-hidden="true"></div>
    <div class="invite-content">
      <div class="invite-gift float" aria-hidden="true">🎁</div>
      <h1 class="invite-headline">
        Someone has a<br/>
        <span class="text-gold">surprise for you.</span>
      </h1>
      <p class="invite-sub">Tap to open your birthday surprise ✨</p>
      <button class="btn btn-primary invite-btn glow-gold" id="btn-open" aria-label="Open your birthday surprise">
        Open Surprise 🎉
      </button>
    </div>
  </div>

  <!-- ============================================================
       SCENE 2 — Birthday Experience
  ============================================================ -->
  <div class="scene hidden" id="scene-main" aria-label="Birthday experience">

    <!-- Balloon container -->
    <div class="balloon-layer" id="balloon-layer" aria-hidden="true"></div>

    <!-- Name reveal canvas container -->
    <div id="name-reveal-container" style="position:fixed;inset:0;pointer-events:none;z-index:1;" aria-hidden="true"></div>

    <!-- Scrollable content -->
    <div class="bday-content" id="bday-content">

      <!-- Name -->
      <div class="name-reveal-wrap" id="name-reveal-wrap">
        <p class="name-reveal-label">Happy Birthday,</p>
        <h1 class="name-reveal" id="name-display" aria-live="assertive"></h1>
        <div class="name-sparkles" aria-hidden="true">✨</div>
      </div>

      <!-- Cake canvas -->
      <div class="cake-canvas-wrap hidden" id="cake-wrap">
        <canvas id="cake-canvas" aria-label="Tap the birthday cake to blow out the candles"></canvas>
      </div>

      <!-- Message -->
      <div class="message-wrap hidden" id="message-wrap">
        <div class="message-card">
          <p class="message-text" id="message-text"></p>
          <p class="sender-text"  id="sender-text"></p>
        </div>
      </div>

      <!-- Photos -->
      <div class="photos-wrap hidden" id="photos-wrap">
        <div class="photos-grid" id="photos-grid"></div>
      </div>

      <!-- Finale -->
      <div class="finale-wrap hidden" id="finale-wrap">
        <div class="finale-emoji" aria-hidden="true">🥳</div>
        <p class="finale-text">Make a wish! 🌟</p>
        <div class="finale-actions">
          <button class="btn btn-primary" id="btn-replay">↺ Replay</button>
          <a href="index.html" class="btn btn-ghost" style="font-size:var(--text-sm);">
            Create yours ✨
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- ============================================================
       ERROR SCENE
  ============================================================ -->
  <div class="scene hidden" id="scene-error" aria-label="Error">
    <div class="error-content">
      <div style="font-size:4rem;margin-bottom:var(--space-4)">😕</div>
      <h2 style="font-family:var(--font-display);font-size:var(--text-3xl);margin-bottom:var(--space-4);">Link not found</h2>
      <p style="color:rgba(255,255,255,0.6);margin-bottom:var(--space-8);">This birthday link may be invalid or incomplete.</p>
      <a href="index.html" class="btn btn-primary">Create a birthday surprise →</a>
    </div>
  </div>

  <!-- Data model + share + animation modules + viewer -->
  <script src="js/data-model.js"></script>
  <script src="js/celebrations.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/share.js"></script>
  <script src="js/music.js"></script>
  <script src="js/animations/name-reveal.js"></script>
  <script src="js/animations/cake.js"></script>
  <script src="js/animations/confetti.js"></script>
  <script src="js/animations/balloons.js"></script>
  <script src="js/animations/fireworks.js"></script>
  <script src="js/viewer.js"></script>

</body>
</html>
