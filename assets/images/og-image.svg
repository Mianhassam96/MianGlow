<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2d2000"/>
      <stop offset="100%" stop-color="#0a0800"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#D4A017" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4A017" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#FF4B8A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF4B8A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#D4A017"/>
      <stop offset="50%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#F7E7CE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#D4A017" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Cake emoji area -->
  <text x="600" y="180" font-size="120" text-anchor="middle" dominant-baseline="middle">🎂</text>

  <!-- Main headline -->
  <text x="600" y="310" font-family="Georgia, serif" font-size="72" font-weight="700"
        text-anchor="middle" fill="url(#textGrad)">Make Their Birthday</text>
  <text x="600" y="390" font-family="Georgia, serif" font-size="72" font-weight="700"
        text-anchor="middle" fill="url(#textGrad)">Unforgettable.</text>

  <!-- Subline -->
  <text x="600" y="460" font-family="'Segoe UI', system-ui, sans-serif" font-size="28"
        text-anchor="middle" fill="#FFF8F0" opacity="0.6">Personalized animated birthday surprises — free, no account needed</text>

  <!-- URL pill -->
  <rect x="440" y="510" width="320" height="52" rx="26" fill="#D4A017" fill-opacity="0.15" stroke="#D4A017" stroke-width="1" stroke-opacity="0.5"/>
  <text x="600" y="542" font-family="'Segoe UI', system-ui, sans-serif" font-size="22"
        text-anchor="middle" fill="#FFD700" font-weight="600">mianglow ✨</text>

  <!-- Sparkles -->
  <text x="80"  y="80"  font-size="40" fill="#FFD700" opacity="0.6">✨</text>
  <text x="1080" y="80"  font-size="36" fill="#FFD700" opacity="0.5">🎉</text>
  <text x="60"  y="560" font-size="32" fill="#FFD700" opacity="0.4">🎈</text>
  <text x="1110" y="560" font-size="34" fill="#FFD700" opacity="0.4">🎆</text>
</svg>
